name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  config-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Run environment config validation
        run: make config-lint

  config-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run config policy tests
        run: go test -v ./pkg/config/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run golangci-lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run unit tests
        run: make test

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: identity_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install migrate tool
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.15.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
      - name: Run migrations
        run: migrate -path migrations -database "postgres://user:password@localhost:5432/identity_platform_test?sslmode=disable" up
      - name: Run integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_USER: user
          TEST_DB_PASSWORD: password
          TEST_DB_NAME: identity_platform_test
        run: go test -v -tags=integration ./tests/integration/...

  build-push:
    needs: [config-lint, config-policy, lint, test, integration-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [authsvc, dirsvc, govsvc, policysvc, provsvc, adminui, landingui]
        include:
          - component: authsvc
            context: .
            dockerfile: cmd/authsvc/Dockerfile
          - component: dirsvc
            context: .
            dockerfile: cmd/dirsvc/Dockerfile
          - component: govsvc
            context: .
            dockerfile: cmd/govsvc/Dockerfile
          - component: policysvc
            context: .
            dockerfile: cmd/policysvc/Dockerfile
          - component: provsvc
            context: .
            dockerfile: cmd/provsvc/Dockerfile
          - component: adminui
            context: web/admin
            dockerfile: web/admin/Dockerfile
          - component: landingui
            context: web/landing
            dockerfile: web/landing/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wardseal-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.component == 'adminui' && 'VITE_AUTHSVC_URL=https://auth-staging.wardseal.com' || '' }}
            ${{ matrix.component == 'adminui' && 'VITE_DIRSVC_URL=https://api-staging.wardseal.com' || '' }}
            ${{ matrix.component == 'adminui' && 'VITE_GOVSVC_URL=https://api-staging.wardseal.com' || '' }}
            ${{ matrix.component == 'adminui' && 'VITE_APP_MODE=saas' || '' }}
            ${{ matrix.component == 'landingui' && 'VITE_SITE_BASE_URL=https://staging.wardseal.com' || '' }}
            ${{ matrix.component == 'landingui' && 'VITE_CONSOLE_BASE_URL=https://manage-staging.wardseal.com' || '' }}
            ${{ matrix.component == 'landingui' && 'VITE_ENVIRONMENT=staging' || '' }}

  update-staging-manifests:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update staging tags
        run: |
          set -e
          SHA=${{ github.sha }}
          # Use yq to update tags in values-staging.yaml
          yq -i ".authsvc.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml
          yq -i ".dirsvc.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml
          yq -i ".govsvc.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml
          yq -i ".policysvc.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml
          yq -i ".provsvc.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml
          yq -i ".adminui.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml
          yq -i ".landingui.image.tag = \"$SHA\"" deploy/charts/wardseal/values-staging.yaml

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(staging): update image tags to ${{ github.sha }} [skip ci]"
          file_pattern: "deploy/charts/wardseal/values-staging.yaml"

  update-production-manifests:
    needs: build-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update production tags
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          # Use yq to update tags in values-production.yaml
          yq -i ".authsvc.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml
          yq -i ".dirsvc.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml
          yq -i ".govsvc.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml
          yq -i ".policysvc.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml
          yq -i ".provsvc.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml
          yq -i ".adminui.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml
          yq -i ".landingui.image.tag = \"$TAG\"" deploy/charts/wardseal/values-production.yaml

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(production): release ${{ github.ref_name }} [skip ci]"
          file_pattern: "deploy/charts/wardseal/values-production.yaml"
