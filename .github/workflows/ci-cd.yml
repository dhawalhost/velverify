name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      service:
        description: "Service image to build and push"
        required: true
        type: choice
        options:
          - authsvc
          - dirsvc
          - govsvc
          - policysvc
          - provsvc
          - adminui
          - landingui
      version:
        description: "Semantic version tag (example: v1.2.3)"
        required: true
        type: string
      tag_suffix:
        description: "Optional extra suffix appended after service (example: rc1)"
        required: false
        type: string
      push_latest:
        description: "Also tag/push latest"
        required: true
        type: boolean
        default: true
      platforms:
        description: "Docker target platforms (comma-separated)"
        required: true
        type: string
        default: "linux/amd64,linux/arm64"
      skip_if_exists:
        description: "Skip build/push if the computed git release tag already exists"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  config-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Set up WardSeal
        run: make setup
      - name: Run environment config validation
        run: make config-lint

  config-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run config policy tests
        run: go test -v ./pkg/config/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run golangci-lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run unit tests
        run: make test
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Set up WardSeal
        run: make setup
      - name: Start Infrastructure
        run: make infra-up
      - name: Run integration tests
        run: make test-integration

  build-push:
    needs: [config-lint, config-policy, lint, test, integration-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and normalize semantic version
        id: semver
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if ! [[ "${RAW_VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '${RAW_VERSION}'. Expected semver like v1.2.3 or 1.2.3"
            exit 1
          fi

          NORMALIZED_VERSION="${RAW_VERSION}"
          if [[ "${NORMALIZED_VERSION}" != v* ]]; then
            NORMALIZED_VERSION="v${NORMALIZED_VERSION}"
          fi
          echo "normalized_version=${NORMALIZED_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ -n "${{ inputs.tag_suffix }}" ]] && ! [[ "${{ inputs.tag_suffix }}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid tag_suffix '${{ inputs.tag_suffix }}'. Allowed characters: letters, numbers, dot, underscore, hyphen"
            exit 1
          fi

      - name: Resolve build target
        id: target
        run: |
          case "${{ inputs.service }}" in
            authsvc|dirsvc|govsvc|policysvc|provsvc)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=cmd/${{ inputs.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
            adminui)
              echo "context=web/admin" >> "$GITHUB_OUTPUT"
              echo "dockerfile=web/admin/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                echo "VITE_AUTHSVC_URL=https://auth-staging.wardseal.com"
                echo "VITE_DIRSVC_URL=https://api-staging.wardseal.com"
                echo "VITE_GOVSVC_URL=https://api-staging.wardseal.com"
                echo "VITE_APP_MODE=saas"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            landingui)
              echo "context=web/landing" >> "$GITHUB_OUTPUT"
              echo "dockerfile=web/landing/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                echo "VITE_SITE_BASE_URL=https://staging.wardseal.com"
                echo "VITE_CONSOLE_BASE_URL=https://manage-staging.wardseal.com"
                echo "VITE_ENVIRONMENT=staging"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported service '${{ inputs.service }}'"
              exit 1
              ;;
          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: release
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wardseal-${{ inputs.service }}"
          VERSION="${{ steps.semver.outputs.normalized_version }}"

          # Docker tag: plain version only (e.g. v1.2.3)
          DOCKER_TAG="${VERSION}"

          # Git tag: version + service + optional suffix (e.g. v1.2.3-authsvc or v1.2.3-authsvc-rc1)
          GIT_TAG="${VERSION}-${{ inputs.service }}"
          if [[ -n "${{ inputs.tag_suffix }}" ]]; then
            GIT_TAG="${GIT_TAG}-${{ inputs.tag_suffix }}"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${GIT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if git tag already exists
        id: exists
        run: |
          GIT_TAG="${{ steps.release.outputs.git_tag }}"
          if git ls-remote --tags origin "refs/tags/${GIT_TAG}" | grep -q "${GIT_TAG}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Git tag already exists: ${GIT_TAG}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Git tag does not exist yet: ${GIT_TAG}"
          fi

      - name: Decide build execution
        id: decision
        run: |
          if [[ "${{ steps.exists.outputs.exists }}" == "true" && "${{ inputs.skip_if_exists }}" == "true" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Tag already exists and skip_if_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.docker_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push
        if: steps.decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.target.outputs.build_args }}

      - name: Create and push git tag
        if: steps.decision.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.git_tag }}" -m "Release ${{ inputs.service }} ${{ steps.release.outputs.docker_tag }}"
          git push origin "${{ steps.release.outputs.git_tag }}"

      - name: Release summary
        run: |
          echo "Service:          ${{ inputs.service }}"
          echo "Normalized version: ${{ steps.semver.outputs.normalized_version }}"
          echo "Docker image:     ${{ steps.release.outputs.image }}:${{ steps.release.outputs.docker_tag }}"
          echo "Platforms:        ${{ inputs.platforms }}"
          echo "Git tag:          ${{ steps.release.outputs.git_tag }}"
          echo "Git tag existed:  ${{ steps.exists.outputs.exists }}"
          echo "skip_if_exists:   ${{ inputs.skip_if_exists }}"
          if [[ "${{ steps.decision.outputs.should_build }}" == "true" ]]; then
            echo "Result: build and push completed"
          else
            echo "Result: build skipped (${{ steps.decision.outputs.skip_reason }})"
          fi
