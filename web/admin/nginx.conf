server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend services
    # Auth Service
    location /login/lookup { proxy_pass http://authsvc:8080; }
    location /t/ { proxy_pass http://authsvc:8080; }
    location /oauth2 { proxy_pass http://authsvc:8080; }
    location /.well-known { proxy_pass http://authsvc:8080; }
    location /social/login { proxy_pass http://authsvc:8080; }
    
    # Auth Service - APIv1 (Apps, keys, MFA, etc.)
    location ~ ^/api/v1/(apps|api-keys|mfa|user|devices|branding|signup|setup|developer) {
        proxy_pass http://authsvc:8080;
    }

    # Directory Service (SCIM & Tenant/User management)
    location /scim { proxy_pass http://dirsvc:8081; }
    location /api/v1/tenants { proxy_pass http://dirsvc:8081; }
    location /internal/discover { proxy_pass http://dirsvc:8081; }

    # Governance Service (Catch-all for other /api/v1 like roles, audit, etc.)
    location /api/v1 { proxy_pass http://govsvc:8082; }
    location /webhooks { proxy_pass http://govsvc:8082; }

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
