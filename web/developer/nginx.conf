server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Developer API: apps, webhooks, API keys, analytics
    location /api/v1/apps { proxy_pass http://authsvc:8080; }
    location /api/v1/api-keys { proxy_pass http://authsvc:8080; }
    location /api/v1/developer { proxy_pass http://authsvc:8080; }
    location /api/v1/webhooks { proxy_pass http://govsvc:8082; }
    location /webhooks { proxy_pass http://govsvc:8082; }

    # Serve the OpenAPI spec for Redoc
    location /openapi.yaml { root /usr/share/nginx/html; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
