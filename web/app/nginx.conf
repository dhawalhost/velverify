server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Auth API (user profile, devices, MFA, passkeys, access requests)
    location ~ ^/api/v1/(user|devices|mfa|webauthn|signals) {
        proxy_pass http://authsvc:8080;
    }

    # Directory: users' own group memberships and app assignments
    location /api/v1/apps { proxy_pass http://authsvc:8080; }

    # Governance: access request workflows and general API fallback
    location /api/v1/campaigns { proxy_pass http://govsvc:8082; }
    location /api/v1/access-requests { proxy_pass http://govsvc:8082; }
    location /api/v1 { proxy_pass http://govsvc:8082; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
