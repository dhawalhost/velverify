server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — no auth, public page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Status API (read-only health endpoint from authsvc/dirsvc/govsvc)
    location /api/v1/health { proxy_pass http://authsvc:8080; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
