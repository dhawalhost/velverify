server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy auth API calls to authsvc
    location /t/ { proxy_pass http://authsvc:8080; }
    location /oauth2/ { proxy_pass http://authsvc:8080; }
    location /.well-known/ { proxy_pass http://authsvc:8080; }
    location /social/login { proxy_pass http://authsvc:8080; }
    location /login/lookup { proxy_pass http://authsvc:8080; }
    location /saml/ { proxy_pass http://authsvc:8080; }
    location /logout { proxy_pass http://authsvc:8080; }
    location /api/v1/logout { proxy_pass http://authsvc:8080; }

    location ~ ^/api/v1/(apps|api-keys|mfa|user|devices|branding|signup|setup|developer|signals|webauthn|logout) {
        proxy_pass http://authsvc:8080;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
