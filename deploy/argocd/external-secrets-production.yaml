# External Secrets Operator - Production Configuration
# Automatically syncs secrets from HashiCorp Vault
#
# Prerequisites:
# 1. Install External Secrets Operator
# 2. Create ClusterSecretStore for Vault
# 3. Ensure Vault policies are correctly configured
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-production
spec:
  provider:
    vault:
      server: "https://vault.dhawalhost.com:8200"
      path: "secret"
      version: "v2"
      namespace: "wardseal-prod"  # Vault namespace (Enterprise)
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
        namespace: wardseal-production
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: wardseal-vault-approle
            key: role_id
            namespace: wardseal-production
          secretRef:
            name: wardseal-vault-approle
            key: secret_id
            namespace: wardseal-production
---
# Bootstrap secret (managed outside of git - use setup script)
# kubectl create secret generic wardseal-vault-approle \
#   --namespace wardseal-production \
#   --from-literal=role_id=xxx \
#   --from-literal=secret_id=yyy
---
# Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-db-credentials-production
  namespace: wardseal-production
spec:
  refreshInterval: 1m  # More frequent refresh in production
  secretStoreRef:
    name: vault-backend-production
    kind: ClusterSecretStore
  target:
    name: wardseal-db-credentials-production
    creationPolicy: Owner
    deletionPolicy: Retain  # Don't delete secret if ExternalSecret is deleted
  data:
    - secretKey: username
      remoteRef:
        key: wardseal/production/database
        property: username
    - secretKey: password
      remoteRef:
        key: wardseal/production/database
        property: password
    - secretKey: host
      remoteRef:
        key: wardseal/production/database
        property: host
    - secretKey: port
      remoteRef:
        key: wardseal/production/database
        property: port
    - secretKey: database
      remoteRef:
        key: wardseal/production/database
        property: database
---
# Service Auth Token
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-service-auth-production
  namespace: wardseal-production
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend-production
    kind: ClusterSecretStore
  target:
    name: wardseal-service-auth-production
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: wardseal/production/service-auth
        property: token
---
# Vault KMS Configuration
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-vault-kms-production
  namespace: wardseal-production
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend-production
    kind: ClusterSecretStore
  target:
    name: wardseal-vault-kms-production
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VAULT_ADDR
      remoteRef:
        key: wardseal/production/kms
        property: vault_addr
    - secretKey: VAULT_ROLE_ID
      remoteRef:
        key: wardseal/production/kms
        property: role_id
    - secretKey: VAULT_SECRET_ID
      remoteRef:
        key: wardseal/production/kms
        property: secret_id
    - secretKey: VAULT_KEY_NAME
      remoteRef:
        key: wardseal/production/kms
        property: key_name
---
# License Key (Enterprise)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-license-production
  namespace: wardseal-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-production
    kind: ClusterSecretStore
  target:
    name: wardseal-license-production
    creationPolicy: Owner
  data:
    - secretKey: LICENSE_KEY
      remoteRef:
        key: wardseal/production/license
        property: key
