# WardSeal Secrets Template - Development
# Apply after creating namespace: kubectl apply -f secrets-development.yaml -n wardseal-dev
#
# For production, use:
# - HashiCorp Vault with External Secrets Operator
# - Or the setup-secrets.sh script
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-db-credentials-dev
  namespace: wardseal-dev
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: database
    environment: development
type: Opaque
stringData:
  username: "wardseal"
  password: "dev-password"  # CHANGE THIS
  host: "postgres"
  port: "5432"
  database: "identity_platform_dev"
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-service-auth-dev
  namespace: wardseal-dev
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: auth
    environment: development
type: Opaque
stringData:
  token: "dev-internal-token"  # CHANGE THIS
  header: "X-Service-Auth"
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-jwt-keys-dev
  namespace: wardseal-dev
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: auth
    environment: development
type: Opaque
stringData:
  # Generate with: openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
  private-key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_YOUR_PRIVATE_KEY
    -----END PRIVATE KEY-----
  # Generate with: openssl rsa -pubout -in private.pem -out public.pem
  public-key: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_YOUR_PUBLIC_KEY
    -----END PUBLIC KEY-----
