# External Secrets Operator - Staging Configuration
# Automatically syncs secrets from HashiCorp Vault
#
# Prerequisites:
# 1. Install External Secrets Operator: https://external-secrets.io/
# 2. Create ClusterSecretStore for Vault
# 3. Apply this file: kubectl apply -f external-secrets-staging.yaml
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-staging
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: wardseal-vault-approle
            key: role_id
            namespace: wardseal-staging
          secretRef:
            name: wardseal-vault-approle
            key: secret_id
            namespace: wardseal-staging
---
# NOTE: Bootstrap secret 'wardseal-vault-approle' must be created manually
# with real AppRole credentials from Vault. Never commit secrets to Git!
# 
# Create it with:
# kubectl create secret generic wardseal-vault-approle \
#   --namespace wardseal-staging \
#   --from-literal=role_id="<YOUR_ROLE_ID>" \
#   --from-literal=secret_id="<YOUR_SECRET_ID>"
---
# Database Credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardseal-db-credentials-staging
  namespace: wardseal-staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-staging
    kind: ClusterSecretStore
  target:
    name: wardseal-db-credentials-staging
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/wardseal/staging/database
        property: username
    - secretKey: password
      remoteRef:
        key: secret/wardseal/staging/database
        property: password
    - secretKey: host
      remoteRef:
        key: secret/wardseal/staging/database
        property: host
    - secretKey: port
      remoteRef:
        key: secret/wardseal/staging/database
        property: port
    - secretKey: database
      remoteRef:
        key: secret/wardseal/staging/database
        property: database
---
# Service Auth Token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardseal-service-auth-staging
  namespace: wardseal-staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-staging
    kind: ClusterSecretStore
  target:
    name: wardseal-service-auth-staging
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: secret/wardseal/staging/service-auth
        property: token
---
# Vault KMS Configuration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardseal-vault-kms-staging
  namespace: wardseal-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-staging
    kind: ClusterSecretStore
  target:
    name: wardseal-vault-kms-staging
    creationPolicy: Owner
  data:
    - secretKey: VAULT_ADDR
      remoteRef:
        key: secret/wardseal/staging/kms
        property: vault_addr
    - secretKey: VAULT_ROLE_ID
      remoteRef:
        key: secret/wardseal/staging/kms
        property: role_id
    - secretKey: VAULT_SECRET_ID
      remoteRef:
        key: secret/wardseal/staging/kms
        property: secret_id
    - secretKey: VAULT_KEY_NAME
      remoteRef:
        key: secret/wardseal/staging/kms
        property: key_name
