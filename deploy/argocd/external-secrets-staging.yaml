# External Secrets Operator - Staging Configuration
# Automatically syncs secrets from HashiCorp Vault
#
# Prerequisites:
# 1. Install External Secrets Operator: https://external-secrets.io/
# 2. Create ClusterSecretStore for Vault
# 3. Apply this file: kubectl apply -f external-secrets-staging.yaml
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-staging
spec:
  provider:
    vault:
      server: "https://vault.dhawalhost.com:8200"
      path: "secret"
      version: "v2"
      namespace: "wardseal"  # Vault namespace (Enterprise)
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: wardseal-vault-approle
            key: role_id
            namespace: wardseal-staging
          secretRef:
            name: wardseal-vault-approle
            key: secret_id
            namespace: wardseal-staging
---
# Bootstrap secret for AppRole auth (create manually or via setup script)
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-vault-approle
  namespace: wardseal-staging
type: Opaque
stringData:
  role_id: "REPLACE_WITH_ROLE_ID"
  secret_id: "REPLACE_WITH_SECRET_ID"
---
# Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-db-credentials-staging
  namespace: wardseal-staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-staging
    kind: ClusterSecretStore
  target:
    name: wardseal-db-credentials-staging
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: wardseal/staging/database
        property: username
    - secretKey: password
      remoteRef:
        key: wardseal/staging/database
        property: password
    - secretKey: host
      remoteRef:
        key: wardseal/staging/database
        property: host
---
# Service Auth Token
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-service-auth-staging
  namespace: wardseal-staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-staging
    kind: ClusterSecretStore
  target:
    name: wardseal-service-auth-staging
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: wardseal/staging/service-auth
        property: token
---
# Vault KMS Configuration
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wardseal-vault-kms-staging
  namespace: wardseal-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-staging
    kind: ClusterSecretStore
  target:
    name: wardseal-vault-kms-staging
    creationPolicy: Owner
  data:
    - secretKey: VAULT_ADDR
      remoteRef:
        key: wardseal/staging/kms
        property: vault_addr
    - secretKey: VAULT_ROLE_ID
      remoteRef:
        key: wardseal/staging/kms
        property: role_id
    - secretKey: VAULT_SECRET_ID
      remoteRef:
        key: wardseal/staging/kms
        property: secret_id
    - secretKey: VAULT_KEY_NAME
      remoteRef:
        key: wardseal/staging/kms
        property: key_name
