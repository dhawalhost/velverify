# WardSeal Secrets Template - Staging
# 
# RECOMMENDED: Use External Secrets Operator with Vault instead of this file
# This template is for reference only
#
# With External Secrets Operator:
# kubectl apply -f external-secrets-staging.yaml -n wardseal-staging
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-db-credentials-staging
  namespace: wardseal-staging
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: database
    environment: staging
type: Opaque
stringData:
  username: "wardseal_staging"
  password: "REPLACE_FROM_VAULT"
  host: "postgres-staging.wardseal.svc.cluster.local"
  port: "5432"
  database: "identity_platform_staging"
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-service-auth-staging
  namespace: wardseal-staging
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: auth
    environment: staging
type: Opaque
stringData:
  token: "REPLACE_FROM_VAULT"
  header: "X-Service-Auth"
---
# For Vault KMS Integration
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-vault-auth-staging
  namespace: wardseal-staging
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: kms
    environment: staging
type: Opaque
stringData:
  VAULT_ADDR: "https://vault.example.com:8200"
  VAULT_ROLE_ID: "REPLACE_WITH_ROLE_ID"
  VAULT_SECRET_ID: "REPLACE_WITH_SECRET_ID"
  VAULT_KEY_NAME: "wardseal-signing-key-staging"
