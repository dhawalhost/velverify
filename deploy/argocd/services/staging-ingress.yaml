apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wardseal-staging-ingress
  namespace: argocd
  labels:
    environment: staging
    service: ingress
spec:
  project: default
  source:
    repoURL: https://github.com/dhawalhost/wardseal.git
    targetRevision: main
    path: deploy/charts/wardseal
    helm:
      releaseName: wardseal
      valueFiles:
        - values.yaml
        - values-staging.yaml
        - services/ingress/selector.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wardseal-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
