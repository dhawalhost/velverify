apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wardseal-production
  namespace: argocd
  labels:
    environment: production
    component: core
spec:
  project: default

  source:
    repoURL: https://github.com/dhawalhost/wardseal.git
    targetRevision: main
    path: deploy/charts/wardseal
    
    helm:
      releaseName: wardseal
      valueFiles:
        - values.yaml
        - values-production.yaml
        - values-production-versions.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: wardseal-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
