# WardSeal Secrets Template - Production
#
# ⚠️  DO NOT USE THIS FILE IN PRODUCTION ⚠️
# 
# Use External Secrets Operator with HashiCorp Vault:
# kubectl apply -f external-secrets-production.yaml -n wardseal-production
#
# This file is for REFERENCE ONLY to show what secrets are required.
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-db-credentials-production
  namespace: wardseal-production
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: database
    environment: production
type: Opaque
stringData:
  username: "wardseal_prod"
  password: "NEVER_STORE_IN_GIT"
  host: "postgres.wardseal.svc.cluster.local"
  port: "5432"
  database: "identity_platform"
---
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-service-auth-production
  namespace: wardseal-production
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: auth
    environment: production
type: Opaque
stringData:
  token: "NEVER_STORE_IN_GIT"
  header: "X-Service-Auth"
---
# Vault KMS Configuration
apiVersion: v1
kind: Secret
metadata:
  name: wardseal-vault-auth-production
  namespace: wardseal-production
  labels:
    app.kubernetes.io/name: wardseal
    app.kubernetes.io/component: kms
    environment: production
type: Opaque
stringData:
  VAULT_ADDR: "https://vault.example.com:8200"
  VAULT_NAMESPACE: "wardseal"
  VAULT_ROLE_ID: "NEVER_STORE_IN_GIT"
  VAULT_SECRET_ID: "NEVER_STORE_IN_GIT"
  VAULT_KEY_NAME: "wardseal-signing-key-production"
