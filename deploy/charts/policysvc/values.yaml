# ====================
# Policy Service Configuration
# ====================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ====================
# Image Configuration
# ====================
image:
  registry: ""  # Optional: specify registry, defaults to global.imageRegistry
  repository: ghcr.io/dhawalhost/wardseal-policysvc
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the image tag whose default is the chart appVersion
  pullSecrets: []

# ====================
# Service Configuration
# ====================
service:
  type: ClusterIP
  port: 8083
  annotations: {}

# ====================
# Ingress Configuration
# ====================
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

# ====================
# Application Environment
# ====================
env:
  LOG_LEVEL: info

# ====================
# Database Configuration
# ====================
database:
  existingSecret: wardseal-db-credentials-dev  # Can be overridden per environment
  # Secret should contain: host, port, username, password, database

# ====================
# Vault AppRole Configuration
# ====================
vaultAppRole:
  existingSecret: vault-approle  # Optional, for Vault integration
  # Secret should contain: role-id, secret-id

# ====================
# Security Contexts
# ====================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# ====================
# Health Checks
# ====================
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30  # 150s max startup time

# ====================
# Resource Management
# ====================
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ====================
# Autoscaling
# ====================
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# ====================
# Pod Disruption Budget
# ====================
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ====================
# Network Policy
# ====================
networkPolicy:
  enabled: false

# ====================
# ServiceAccount
# ====================
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

# ====================
# Monitoring & Metrics
# ====================
metrics:
  enabled: true
  port: 9090
  path: /metrics

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# ====================
# Pod Annotations & Labels
# ====================
podAnnotations: {}
podLabels: {}

# ====================
# Scheduling
# ====================
nodeSelector: {}
tolerations: []
affinity: {}

# ====================
# Additional Volumes
# ====================
volumes: []
volumeMounts: []

# ====================
# Global Values (from parent chart)
# ====================
global:
  imageRegistry: ""
  imagePullSecrets: []
