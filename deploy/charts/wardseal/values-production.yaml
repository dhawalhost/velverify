# Wardseal Production Environment Values
# This file contains production-specific configuration with ALL best practices enabled

global:
  imageRegistry: ghcr.io/dhawalhost

# ====================
# Auth Service - Production
# ====================
authsvc:
  enabled: true
  replicaCount: 3
  
  image:
    tag: ""  # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  
  env:
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc:8081
    LOG_LEVEL: warn
  
  # Security contexts
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  
  # Health probes
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  
  startupProbe:
    httpGet:
      path: /health/startup
      port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
  
  database:
    existingSecret: wardseal-db-credentials-production
  
  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  # High availability
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  
  # Security
  networkPolicy:
    enabled: true
  
  # Monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  
  # Pod anti-affinity for better distribution
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: authsvc
            topologyKey: kubernetes.io/hostname

