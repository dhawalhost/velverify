# ====================
# Ingress - Production
# ====================
adminui:
  enabled: true

landingui:
  enabled: true

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: auth.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: authsvc
          port: 8080
    - host: api.wardseal.com
      paths:
        - path: /api/v1/users
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/groups
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/oauth
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/governance
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/policy
          pathType: Prefix
          service: policysvc
          port: 8083
        - path: /api/v1/provisioning
          pathType: Prefix
          service: provsvc
          port: 8084
    - host: console.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: adminui
          port: 80
    - host: wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: landingui
          port: 80
    - host: help.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: landingui
          port: 80
  tls:
    - secretName: wardseal-tls
      hosts:
        - auth.wardseal.com
        - api.wardseal.com
        - console.wardseal.com
        - wardseal.com
        - help.wardseal.com
