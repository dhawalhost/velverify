# Staging Environment Values
# Override default values for staging deployment

global:
  imageRegistry: ghcr.io/dhawalhost

# Database - Staging
database:
  host: postgres-staging.wardseal.svc.cluster.local
  port: 5432
  name: identity_platform_staging
  sslMode: require
  existingSecret: wardseal-db-credentials-staging

# KMS Configuration - Use Vault in staging
kms:
  provider: vault
  vaultSecretName: wardseal-vault-kms-staging

# Auth Service - Staging
authsvc:
  enabled: true
  replicaCount: 1

  database:
    existingSecret: wardseal-db-credentials-staging

  vaultAppRole:
    existingSecret: wardseal-vault-kms-staging

  image:
    tag: "latest"  # Base/default only; overridden by values-staging-versions.yaml in Argo CD

  env:
    ENVIRONMENT: staging
    LOG_LEVEL: debug
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc:8081
    AUTH_SERVICE_URL: https://auth-staging.wardseal.com
    UI_URL: https://manage-staging.wardseal.com
    KMS_PROVIDER: vault
    REDIS_ENABLED: "true"
    REDIS_ADDR: redis-staging.wardseal.svc.cluster.local:6379
    WEBAUTHN_SESSION_TTL_SECONDS: "600"
    RATE_LIMIT_USE_TENANT: "true"
    RATE_LIMIT_KEY_PREFIX: wardseal:ratelimit
    CORS_ALLOWED_ORIGINS: https://staging.wardseal.com,https://manage-staging.wardseal.com

  envFrom:
    - secretRef:
        name: wardseal-vault-kms-staging

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Directory Service - Staging
dirsvc:
  enabled: true
  replicaCount: 1

  database:
    existingSecret: wardseal-db-credentials-staging

  vaultAppRole:
    existingSecret: wardseal-vault-kms-staging

  image:
    tag: "latest"  # Base/default only; overridden by values-staging-versions.yaml in Argo CD

  env:
    LOG_LEVEL: debug
    REDIS_ENABLED: "true"
    REDIS_ADDR: redis-staging.wardseal.svc.cluster.local:6379
    RATE_LIMIT_USE_TENANT: "true"
    RATE_LIMIT_KEY_PREFIX: wardseal:ratelimit
    CORS_ALLOWED_ORIGINS: https://staging.wardseal.com,https://manage-staging.wardseal.com

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Governance Service - Staging
govsvc:
  enabled: true
  replicaCount: 1

  database:
    existingSecret: wardseal-db-credentials-staging

  vaultAppRole:
    existingSecret: wardseal-vault-kms-staging

  image:
    tag: "latest"  # Base/default only; overridden by values-staging-versions.yaml in Argo CD

  env:
    LOG_LEVEL: debug
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc:8081
    REDIS_ENABLED: "true"
    REDIS_ADDR: redis-staging.wardseal.svc.cluster.local:6379
    RATE_LIMIT_USE_TENANT: "true"
    RATE_LIMIT_KEY_PREFIX: wardseal:ratelimit
    CORS_ALLOWED_ORIGINS: https://staging.wardseal.com,https://manage-staging.wardseal.com

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

adminui:
  enabled: true

  nginx:
    authServiceHost: wardseal-authsvc
    authServicePort: 8080
    directoryServiceHost: wardseal-dirsvc
    directoryServicePort: 8081
    governanceServiceHost: wardseal-govsvc
    governanceServicePort: 8082

  image:
    tag: "latest"  # Base/default only; overridden by values-staging-versions.yaml in Argo CD

landingui:
  enabled: true
  image:
    tag: "latest"  # Base/default only; overridden by values-staging-versions.yaml in Argo CD

policysvc:
  database:
    existingSecret: wardseal-db-credentials-staging
  vaultAppRole:
    existingSecret: wardseal-vault-kms-staging

provsvc:
  database:
    existingSecret: wardseal-db-credentials-staging
  vaultAppRole:
    existingSecret: wardseal-vault-kms-staging

# Ingress - Staging
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: auth-staging.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: authsvc
          port: 8080
    - host: api-staging.wardseal.com
      paths:
        - path: /api/v1/users
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/groups
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/oauth
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/governance
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/policy
          pathType: Prefix
          service: policysvc
          port: 8083
        - path: /api/v1/provisioning
          pathType: Prefix
          service: provsvc
          port: 8084
    - host: manage-staging.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: adminui
          port: 80
    - host: staging.wardseal.com
      paths:
        - path: /
          pathType: Prefix
          service: landingui
          port: 80
  tls:
    - secretName: wardseal-tls-staging
      hosts:
        - auth-staging.wardseal.com
        - api-staging.wardseal.com
        - manage-staging.wardseal.com
        - staging.wardseal.com
