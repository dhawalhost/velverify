# Local Development Values (Rancher Desktop / k3s)
# ===================================================
# Use this file to deploy the full Wardseal stack locally via Helm.
# No TLS, no cert-manager, no external secrets — everything inline for dev speed.
#
# Deploy command:
#   helm upgrade --install wardseal ./deploy/charts/wardseal \
#     -n wardseal-local --create-namespace \
#     -f deploy/charts/wardseal/values.yaml \
#     -f deploy/charts/wardseal/values-local.yaml

global:
  imageRegistry: ""  # Images are built locally; use local tag below

# Use locally-built images. Build with --load to ensure images reach the dockerd
# that k3s uses via cri-dockerd (Rancher Desktop requirement):
#   docker build --load -t wardseal-authsvc:local -f cmd/authsvc/Dockerfile .
#   (handled automatically by scripts/deploy_local_k8s.sh)

# Database — local in-cluster postgres (see k8s-local/postgres.yaml)
database:
  host: postgres.wardseal-local.svc.cluster.local
  port: 5432
  name: identity_platform
  sslMode: disable
  existingSecret: wardseal-db-credentials

# No Vault in local — use local KMS (key files mounted via secret)
kms:
  provider: local

# =====================
# Auth Service
# =====================
authsvc:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-authsvc
    tag: "local"
    pullPolicy: IfNotPresent

  env:
    ENVIRONMENT: local
    LOG_LEVEL: debug
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc.wardseal-local.svc.cluster.local:8081
    AUTH_SERVICE_URL: http://auth.wardseal.local
    KMS_PROVIDER: local
    JWT_PRIVATE_KEY_PATH: /etc/wardseal/keys/private_key.pem
    JWT_PUBLIC_KEY_PATH: /etc/wardseal/keys/public_key.pem
    DEPLOYMENT_MODE: saas
    UI_URL: http://auth.wardseal.local
    REDIS_ADDR: redis.wardseal-local.svc.cluster.local:6379
    REDIS_DB: "0"
    REDIS_ENABLED: "true"
    WEBAUTHN_SESSION_TTL_SECONDS: "600"
    CORS_ALLOWED_ORIGINS: "http://auth.wardseal.local,http://manage.wardseal.local,http://wardseal.local"
    RATE_LIMIT_USE_TENANT: "true"
    RATE_LIMIT_KEY_PREFIX: "wardseal:ratelimit"

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  database:
    existingSecret: wardseal-db-credentials

  # No Vault in local — sub-chart default is vault-approle; disable it
  vaultAppRole:
    existingSecret: ""

  # Mount JWT signing keys from wardseal-jwt-keys secret
  volumes:
    - name: jwt-keys
      secret:
        secretName: wardseal-jwt-keys

  volumeMounts:
    - name: jwt-keys
      mountPath: /etc/wardseal/keys
      readOnly: true

  autoscaling:
    enabled: false

# =====================
# Directory Service
# =====================
dirsvc:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-dirsvc
    tag: "local"
    pullPolicy: IfNotPresent

  env:
    ENVIRONMENT: local
    LOG_LEVEL: debug
    REDIS_ADDR: redis.wardseal-local.svc.cluster.local:6379
    REDIS_ENABLED: "true"
    CORS_ALLOWED_ORIGINS: "http://auth.wardseal.local,http://manage.wardseal.local,http://wardseal.local"

  database:
    existingSecret: wardseal-db-credentials

  # No Vault in local
  vaultAppRole:
    existingSecret: ""

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =====================
# Governance Service
# =====================
govsvc:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-govsvc
    tag: "local"
    pullPolicy: IfNotPresent

  env:
    ENVIRONMENT: local
    LOG_LEVEL: debug
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc.wardseal-local.svc.cluster.local:8081
    REDIS_ADDR: redis.wardseal-local.svc.cluster.local:6379
    REDIS_ENABLED: "true"
    CORS_ALLOWED_ORIGINS: "http://auth.wardseal.local,http://manage.wardseal.local,http://wardseal.local"

  database:
    existingSecret: wardseal-db-credentials

  # No Vault in local
  vaultAppRole:
    existingSecret: ""

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =====================
# Policy Service
# =====================
policysvc:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-policysvc
    tag: "local"
    pullPolicy: IfNotPresent

  env:
    ENVIRONMENT: local
    LOG_LEVEL: debug
  
  database:
    existingSecret: wardseal-db-credentials

  vaultAppRole:
    existingSecret: ""

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =====================
# Provisioning Service
# =====================
provsvc:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-provsvc
    tag: "local"
    pullPolicy: IfNotPresent

  env:
    ENVIRONMENT: local
    LOG_LEVEL: debug
    CORS_ALLOWED_ORIGINS: "http://auth.wardseal.local,http://manage.wardseal.local,http://wardseal.local"

  database:
    existingSecret: wardseal-db-credentials

  vaultAppRole:
    existingSecret: ""

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# =====================
# Admin UI
# VITE_* URLs are baked in at docker build time (--build-arg); see deploy_local_k8s.sh
# =====================
adminui:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-adminui
    tag: "local"
    pullPolicy: IfNotPresent

  nginx:
    authServiceHost: wardseal-authsvc
    authServicePort: 8080
    directoryServiceHost: wardseal-dirsvc
    directoryServicePort: 8081
    governanceServiceHost: wardseal-govsvc
    governanceServicePort: 8082

  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 20m
      memory: 16Mi

# =====================
# Landing Site
# React + Vite SPA served by NGINX; VITE_* URLs are baked in at docker build time
# =====================
landingui:
  enabled: true
  replicaCount: 1

  image:
    repository: wardseal-landingui
    tag: "local"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 50m
      memory: 32Mi
    requests:
      cpu: 10m
      memory: 16Mi

# =====================
# Ingress — HTTP only, Traefik (already runs in k3s)
# Uses local hostnames; add them to /etc/hosts (done by deploy script)
# =====================
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web   # HTTP port 80
    traefik.ingress.kubernetes.io/router.tls: "false"       # No TLS locally
  hosts:
    - host: auth.wardseal.local
      paths:
        - path: /
          pathType: Prefix
          service: authsvc
          port: 8080
    - host: api.wardseal.local
      paths:
        - path: /scim
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/users
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/groups
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/scim
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/organizations
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/campaigns
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/roles
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/permissions
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/audit
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/sso
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/connectors
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/oauth
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/governance
          pathType: Prefix
          service: govsvc
          port: 8082
        - path: /api/v1/policy
          pathType: Prefix
          service: policysvc
          port: 8083
        - path: /api/v1/provisioning
          pathType: Prefix
          service: provsvc
          port: 8084
        - path: /api/v1/webhooks
          pathType: Prefix
          service: govsvc
          port: 8082
    - host: manage.wardseal.local
      paths:
        - path: /
          pathType: Prefix
          service: adminui
          port: 80
    - host: wardseal.local
      paths:
        - path: /
          pathType: Prefix
          service: landingui
          port: 80
  tls: []   # No TLS locally

  tls: []   # No TLS locally
