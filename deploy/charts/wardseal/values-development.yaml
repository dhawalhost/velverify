# Development Environment Values
# For local kubernetes (minikube/kind) or dev cluster

global:
  imageRegistry: ghcr.io/dhawalhost

# Database - Development (use local postgres)
database:
  host: postgres
  port: 5432
  name: identity_platform_dev
  sslMode: disable
  existingSecret: wardseal-db-credentials-dev

# KMS Configuration - Use local keys in development
kms:
  provider: local
  # For Vault in dev (optional):
  # provider: vault
  # vaultAddr: http://vault:8200

# Auth Service - Development
authsvc:
  enabled: true
  replicaCount: 1

  image:
    tag: "latest"
    pullPolicy: Always  # Always pull in dev

  env:
    ENVIRONMENT: development
    LOG_LEVEL: debug
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc:8081
    AUTH_SERVICE_URL: http://localhost:8080
    KMS_PROVIDER: local

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # No autoscaling in dev
  autoscaling:
    enabled: false

# Directory Service - Development
dirsvc:
  enabled: true
  replicaCount: 1

  image:
    tag: "latest"
    pullPolicy: Always

  env:
    ENVIRONMENT: development
    LOG_LEVEL: debug

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Governance Service - Development
govsvc:
  enabled: true
  replicaCount: 1

  image:
    tag: "latest"
    pullPolicy: Always

  env:
    ENVIRONMENT: development
    LOG_LEVEL: debug
    DIRECTORY_SERVICE_URL: http://wardseal-dirsvc:8081

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Ingress - Development (no TLS)
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: wardseal.local
      paths:
        - path: /
          pathType: Prefix
          service: authsvc
          port: 8080
        - path: /api/v1/users
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/groups
          pathType: Prefix
          service: dirsvc
          port: 8081
        - path: /api/v1/oauth
          pathType: Prefix
          service: govsvc
          port: 8082
  tls: []  # No TLS in dev
