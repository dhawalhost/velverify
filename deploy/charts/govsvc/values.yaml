replicaCount: 1

image:
  repository: your-docker-repo/govsvc
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8082

env:
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

# Database configuration (optional, can be inherited from parent chart)
database:
  existingSecret: wardseal-db-credentials-dev

# Resource limits and requests
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""
