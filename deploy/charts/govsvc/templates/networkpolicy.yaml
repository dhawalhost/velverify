{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "govsvc.fullname" . }}
  labels:
    {{- include "govsvc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "govsvc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: traefik
      ports:
        - protocol: TCP
          port: 8082
    # Allow from other wardseal services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: wardseal
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # Allow to directory service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dirsvc
      ports:
        - protocol: TCP
          port: 8081
    # Allow to database
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for external APIs (if needed)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
