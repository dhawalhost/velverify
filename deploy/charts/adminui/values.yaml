# ====================
# Admin UI Configuration
# Static SPA served by nginx. Service URLs are baked in at Docker build time
# via --build-arg VITE_*_URL=... and cannot be changed at runtime.
# When deploying locally, pass build args to `docker build --load`.
# ====================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ====================
# Image Configuration
# ====================
image:
  registry: ""  # Optional: specify registry, defaults to global.imageRegistry
  repository: ghcr.io/dhawalhost/wardseal-adminui
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the image tag whose default is the chart appVersion
  pullSecrets: []

# ====================
# Service Configuration
# ====================
service:
  type: ClusterIP
  port: 80
  annotations: {}

# ====================
# Ingress Configuration
# ====================
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

# ====================
# Application Environment
# Vite env vars are build-time only (baked into JS at docker build).
# These are documented here for reference — they are NOT injected at runtime.
# ====================
buildArgs:
  VITE_AUTHSVC_URL: ""
  VITE_DIRSVC_URL: ""
  VITE_GOVSVC_URL: ""

# ====================
# Nginx upstream service names
# ====================
nginx:
  authServiceHost: authsvc
  authServicePort: 8080
  directoryServiceHost: dirsvc
  directoryServicePort: 8081
  governanceServiceHost: govsvc
  governanceServicePort: 8082

# ====================
# Security Contexts
# ====================
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # nginx needs to write pid file and cache

# ====================
# Health Checks (nginx serves / -> 200 for the SPA)
# ====================
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12  # 60s max startup

# ====================
# Resource Management
# ====================
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

# ====================
# Autoscaling
# ====================
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# ====================
# Pod Disruption Budget
# ====================
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ====================
# Network Policy
# ====================
networkPolicy:
  enabled: false

# ====================
# ServiceAccount
# ====================
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

# ====================
# Monitoring & Metrics
# Admin UI is a static nginx SPA — no Prometheus metrics endpoint.
# ====================
metrics:
  enabled: false
  port: 9090
  path: /metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# ====================
# Pod Annotations & Labels
# ====================
podAnnotations: {}
podLabels: {}

# ====================
# Scheduling
# ====================
nodeSelector: {}
tolerations: []
affinity: {}

# ====================
# Additional Volumes
# ====================
volumes: []
volumeMounts: []

# ====================
# Global Values (from parent chart)
# ====================
global:
  imageRegistry: ""
  imagePullSecrets: []
