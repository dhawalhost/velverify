apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adminui.fullname" . }}-nginx
  labels:
    {{- include "adminui.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Auth Service — auth flows proxied to authsvc
        location /t/ { proxy_pass http://wardseal-authsvc:8080; }
        location /oauth2/ { proxy_pass http://wardseal-authsvc:8080; }
        location /.well-known/ { proxy_pass http://wardseal-authsvc:8080; }
        location /social/login { proxy_pass http://wardseal-authsvc:8080; }
        location /login/lookup { proxy_pass http://wardseal-authsvc:8080; }
        location /saml/ { proxy_pass http://wardseal-authsvc:8080; }

        location ~ ^/api/v1/(apps|api-keys|mfa|user|devices|branding|setup|developer|webauthn|signals) {
            proxy_pass http://wardseal-authsvc:8080;
        }

        # Directory Service
        location /scim/ { proxy_pass http://wardseal-dirsvc:8081; }
        location /api/v1/tenants { proxy_pass http://wardseal-dirsvc:8081; }
        location /internal/discover { proxy_pass http://wardseal-dirsvc:8081; }
        location /api/v1/users { proxy_pass http://wardseal-dirsvc:8081; }
        location /api/v1/groups { proxy_pass http://wardseal-dirsvc:8081; }

        # Governance Service (catch-all for remaining /api/v1)
        location /api/v1/ { proxy_pass http://wardseal-govsvc:8082; }
        location /webhooks/ { proxy_pass http://wardseal-govsvc:8082; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
