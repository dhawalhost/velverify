apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adminui.fullname" . }}-nginx
  labels:
    {{- include "adminui.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /login/lookup { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /t/ { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /oauth2 { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /.well-known { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }
        location /social/login { proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }}; }

        location ~ ^/api/v1/(apps|api-keys|mfa|user|devices|branding|signup|setup|developer) {
            proxy_pass http://{{ .Values.nginx.authServiceHost }}:{{ .Values.nginx.authServicePort }};
        }

        location /scim { proxy_pass http://{{ .Values.nginx.directoryServiceHost }}:{{ .Values.nginx.directoryServicePort }}; }
        location /api/v1/tenants { proxy_pass http://{{ .Values.nginx.directoryServiceHost }}:{{ .Values.nginx.directoryServicePort }}; }
        location /internal/discover { proxy_pass http://{{ .Values.nginx.directoryServiceHost }}:{{ .Values.nginx.directoryServicePort }}; }

        location /api/v1 { proxy_pass http://{{ .Values.nginx.governanceServiceHost }}:{{ .Values.nginx.governanceServicePort }}; }
        location /webhooks { proxy_pass http://{{ .Values.nginx.governanceServiceHost }}:{{ .Values.nginx.governanceServicePort }}; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
