replicaCount: 3

env:
  ENVIRONMENT: production
  LOG_LEVEL: warn
  REDIS_ENABLED: "true"
  REDIS_ADDR: redis-production.wardseal.svc.cluster.local:6379
  RATE_LIMIT_USE_TENANT: "true"
  RATE_LIMIT_KEY_PREFIX: wardseal:ratelimit
  CORS_ALLOWED_ORIGINS: https://wardseal.com,https://manage.wardseal.com

database:
  existingSecret: wardseal-db-credentials-production

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
