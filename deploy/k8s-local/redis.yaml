apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: wardseal-local
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", ""]   # disable persistence for local dev
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wardseal-local
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
